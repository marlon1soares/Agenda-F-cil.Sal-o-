<svg xmlns="http://www.w3.org/2000/svg" width="172" height="364" viewBox="0 0 86 182">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <clipPath id="screenClip">
    <rect x="0" y="0" width="86" height="182" rx="12" ry="12"/>
  </clipPath>

  <g clip-path="url(#screenClip)">
    <!-- Header Background -->
    <rect x="0" y="0" width="86" height="64" fill="url(#headerGrad)"/>

    <!-- Notch -->
    <rect x="27" y="0" width="32" height="5" rx="2.5" fill="#0f172a"/>

    <!-- Status Bar -->
    <text x="8" y="9" fill="#ffffff" font-size="5" font-family="Liberation Sans, sans-serif" font-weight="bold">9:41</text>
    <circle cx="73" cy="7" r="1.5" fill="#ffffff"/>
    <rect x="76" y="5.5" width="4.5" height="3" rx="0.5" fill="#ffffff"/>

    <!-- Back Arrow and User Icon -->
    <text x="6" y="21" fill="#ffffff" font-size="8" font-weight="bold" font-family="Liberation Sans, sans-serif">‹</text>
    <circle cx="78" cy="19" r="3.5" fill="#ffffff" fill-opacity="0.3"/>

    <!-- App Name: Agenda Mais Fácil -->
    <text x="43" y="32" fill="#ffffff" font-size="8.5" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#shadow)">AGENDA</text>
    <text x="43" y="44" fill="#ffffff" font-size="7.5" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#shadow)">MAIS FÁCIL</text>

    <!-- Subtitle / Badge -->
    <rect x="19" y="49.5" width="48" height="7.5" rx="3.75" fill="#ffffff" fill-opacity="0.25"/>
    <text x="43" y="55" fill="#ffffff" font-size="4.2" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">SALÃO &amp; BARBEARIA</text>

    <!-- White Card Body -->
    <rect x="0" y="60" width="86" height="122" fill="#ffffff" rx="10"/>

    <!-- Card Header: Agendamentos -->
    <text x="8" y="72" fill="#334155" font-size="6" font-family="Liberation Sans, sans-serif" font-weight="bold">Agendamentos ›</text>

    <!-- Appointment Rows -->
    <rect x="5" y="77" width="76" height="13" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="9" y="86" fill="#0f172a" font-size="4.8" font-family="Liberation Sans, sans-serif" font-weight="bold">09:00 • Maria Silva</text>
    <text x="66" y="86" fill="#10b981" font-size="4" font-family="Liberation Sans, sans-serif" font-weight="bold">Corte</text>

    <rect x="5" y="93" width="76" height="13" rx="3" fill="#ecfeff" stroke="#a5f3fc" stroke-width="0.5"/>
    <text x="9" y="102" fill="#0f172a" font-size="4.8" font-family="Liberation Sans, sans-serif" font-weight="bold">10:30 • Ana Costa</text>
    <text x="64" y="102" fill="#0891b2" font-size="4" font-family="Liberation Sans, sans-serif" font-weight="bold">Mechas</text>

    <rect x="5" y="109" width="76" height="13" rx="3" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.5"/>
    <text x="9" y="118" fill="#0f172a" font-size="4.8" font-family="Liberation Sans, sans-serif" font-weight="bold">11:30 • Carla Lima</text>
    <text x="63" y="118" fill="#e11d48" font-size="4" font-family="Liberation Sans, sans-serif" font-weight="bold">Escova</text>

    <rect x="5" y="125" width="76" height="13" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="9" y="134" fill="#0f172a" font-size="4.8" font-family="Liberation Sans, sans-serif" font-weight="bold">14:00 • João Santos</text>
    <text x="66" y="134" fill="#64748b" font-size="4" font-family="Liberation Sans, sans-serif" font-weight="bold">Barba</text>

    <!-- Bottom Button: Agendar Agora -->
    <rect x="7" y="145" width="72" height="16" rx="5" fill="#0d9488"/>
    <text x="43" y="156" fill="#ffffff" font-size="6" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Agendar Agora</text>

    <!-- Home indicator bar -->
    <rect x="29" y="174" width="28" height="2" rx="1" fill="#94a3b8"/>
  </g>
</svg>