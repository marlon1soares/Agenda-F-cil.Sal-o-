<svg xmlns="http://www.w3.org/2000/svg" width="344" height="712" viewBox="0 0 344 712">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Screen rounded corner clip -->
  <clipPath id="screenClip">
    <rect x="0" y="0" width="344" height="712" rx="44" ry="44"/>
  </clipPath>

  <g clip-path="url(#screenClip)">
    <!-- Header Gradient -->
    <rect x="0" y="0" width="344" height="248" fill="url(#headerGrad)"/>

    <!-- Top Notch -->
    <rect x="108" y="0" width="128" height="20" rx="10" fill="#090d16"/>

    <!-- Status Bar Icons -->
    <text x="32" y="34" fill="#ffffff" font-size="20" font-family="Liberation Sans, sans-serif" font-weight="bold">9:41</text>
    <circle cx="286" cy="28" r="6" fill="#ffffff"/>
    <rect x="298" y="22" width="18" height="12" rx="2" fill="#ffffff"/>

    <!-- Navigation Header -->
    <text x="24" y="82" fill="#ffffff" font-size="32" font-weight="bold" font-family="Liberation Sans, sans-serif">‹</text>
    <circle cx="310" cy="74" r="14" fill="#ffffff" fill-opacity="0.25"/>

    <!-- MAIN APP NAME REQUESTED BY USER: Agenda Mais Fácil -->
    <text x="172" y="124" fill="#ffffff" font-size="34" font-family="Liberation Sans, sans-serif" font-weight="900" text-anchor="middle" filter="url(#shadow)" letter-spacing="1">AGENDA</text>
    <text x="172" y="168" fill="#ffffff" font-size="30" font-family="Liberation Sans, sans-serif" font-weight="900" text-anchor="middle" filter="url(#shadow)" letter-spacing="0.5">MAIS FÁCIL</text>

    <!-- Subtitle Badge -->
    <rect x="76" y="190" width="192" height="30" rx="15" fill="#ffffff" fill-opacity="0.28"/>
    <text x="172" y="211" fill="#ffffff" font-size="16" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">SALÃO &amp; BARBEARIA</text>

    <!-- White Appointments Card Body -->
    <rect x="0" y="238" width="344" height="474" fill="#ffffff" rx="36" filter="url(#cardShadow)"/>

    <!-- Card Header -->
    <text x="32" y="286" fill="#1e293b" font-size="24" font-family="Liberation Sans, sans-serif" font-weight="bold">Agendamentos ›</text>

    <!-- Row 1: Maria Silva -->
    <rect x="20" y="306" width="304" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="36" y="340" fill="#0f172a" font-size="19" font-family="Liberation Sans, sans-serif" font-weight="bold">09:00 • Maria Silva</text>
    <rect x="240" y="320" width="70" height="24" rx="6" fill="#dcfce7"/>
    <text x="275" y="337" fill="#15803d" font-size="15" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Corte</text>

    <!-- Row 2: Ana Costa -->
    <rect x="20" y="370" width="304" height="52" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
    <text x="36" y="404" fill="#0f172a" font-size="19" font-family="Liberation Sans, sans-serif" font-weight="bold">10:30 • Ana Costa</text>
    <rect x="236" y="384" width="74" height="24" rx="6" fill="#cffafe"/>
    <text x="273" y="401" fill="#0e7490" font-size="15" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Mechas</text>

    <!-- Row 3: Carla Lima -->
    <rect x="20" y="434" width="304" height="52" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <text x="36" y="468" fill="#0f172a" font-size="19" font-family="Liberation Sans, sans-serif" font-weight="bold">11:30 • Carla Lima</text>
    <rect x="238" y="448" width="72" height="24" rx="6" fill="#ffe4e6"/>
    <text x="274" y="465" fill="#be123c" font-size="15" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Escova</text>

    <!-- Row 4: João Santos -->
    <rect x="20" y="498" width="304" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="36" y="532" fill="#0f172a" font-size="19" font-family="Liberation Sans, sans-serif" font-weight="bold">14:00 • João Santos</text>
    <rect x="242" y="512" width="68" height="24" rx="6" fill="#f1f5f9"/>
    <text x="276" y="529" fill="#475569" font-size="15" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Barba</text>

    <!-- Bottom Button: Agendar Horário -->
    <rect x="28" y="578" width="288" height="62" rx="20" fill="#0d9488"/>
    <text x="172" y="618" fill="#ffffff" font-size="24" font-family="Liberation Sans, sans-serif" font-weight="bold" text-anchor="middle">Agendar Horário</text>

    <!-- Home indicator bar -->
    <rect x="116" y="682" width="112" height="8" rx="4" fill="#94a3b8"/>
  </g>
</svg>